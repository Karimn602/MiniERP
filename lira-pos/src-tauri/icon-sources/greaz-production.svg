  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#E9D8C4" stroke-width="12"/>
  <!-- The G: a thick open ring plus its crossbar and spur. -->
  <path d="M 760 330 A 300 300 0 1 0 812 560" fill="none" stroke="#A50E24" stroke-width="170" stroke-linecap="butt"/>
