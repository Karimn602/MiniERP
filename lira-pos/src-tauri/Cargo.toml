[package]
name = "lira-pos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lira_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }

# Phase 2C — direct sqlx pool for transactional posting commands.
# tauri-plugin-sql brings sqlx 0.8 as a transitive dep; we pin to the same
# major to share the underlying SQLite driver and avoid two copies.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# GZ-A0 — SQLite's authorizer callback, for the renderer read pool's
# confidentiality boundary (`src/read_guard.rs`). This is NOT a new SQLite:
# sqlx's `sqlite` feature already pulls `libsqlite3-sys` with `bundled`, and
# cargo unifies features, so declaring it here binds to the SAME crate instance
# and the SAME compiled engine. Pinned to the exact version sqlx 0.8.6 resolves
# (0.30.1) because two libsqlite3-sys majors in one graph would link two copies
# of SQLite, and `as_raw_handle()`'s `sqlite3` type must be the one this crate
# defines or the handle cannot be passed at all.
libsqlite3-sys = { version = "0.30.1", default-features = false }

# Gate 2B Stage A.1 — offline credentials.
#
# `argon2` is the memory-hard hash the credential policy is built on, in its
# RustCrypto form: no C dependency, and it brings `password-hash`, whose PHC
# string carries the salt and the cost parameters INSIDE the stored hash. That
# is what makes raising the cost later a per-credential upgrade rather than a
# migration — an old hash still verifies against its own recorded parameters.
#
# `rand` supplies the OS CSPRNG for the salt, the enrollment code and the
# recovery code. `getrandom` is what actually reads the OS entropy source;
# nothing here invents randomness.
argon2 = { version = "0.5.3", features = ["std"] }
rand = "0.8.5"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# WP-01 test harness only — `#[tokio::test]` and the temp-DB cleanup runtime.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

